# 个学（GeXue）配置
# 环境变量优先级高于本文件；大模型配置与 ~/ww/mianba/backend/config.py 对齐
server:
  port: 8080

db:
  dsn: "postgres://gexue:gexue_password@localhost:5432/gexue?sslmode=disable&client_encoding=UTF8"

llm:
  ark_api_key: ${ARK_API_KEY}
  ark_base_url: https://ark.cn-beijing.volces.com/api/v3
  ark_model: deepseek-v3-2-251201
  deepseek_v4_api_key: ${DEEPSEEK_V4_API_KEY}
  deepseek_v4_base_url: https://api.deepseek.com
  deepseek_v4_model: deepseek-v4-flash
  dashscope_api_key: ${DASHSCOPE_API_KEY}
  dashscope_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

embedding:
  provider: dashscope
  model: text-embedding-v3
  dim: 512

auth:
  jwt_secret: ${JWT_SECRET_KEY}
  token_ttl_hours: 168

# 阿里云短信配置（可选；留空则用开发模式）
aliyun_sms:
  access_key_id: ${ALIYUN_ACCESS_KEY_ID}
  access_key_secret: ${ALIYUN_ACCESS_KEY_SECRET}
  sign_name: ${ALIYUN_SMS_SIGN_NAME}
  template_code: ${ALIYUN_SMS_TEMPLATE_CODE}


chunk:
  max_chunk: 500
  overlap: 60

# 阿里云 OSS 配置（从环境变量读取）
oss:
  access_key_id: ""
  access_key_secret: ""
  bucket: ""
  endpoint: ""
  accel_endpoint: ""

# 火山引擎 OCR 配置（从环境变量读取）
volcengine:
  visual_ak: ""
  visual_sk: ""

log:
  level: debug
