# 个学（GeXue）本地依赖编排
# 当前仅 PostgreSQL+pgvector；后端/前端服务随 M0/S1 骨架逐步加入
services:
  postgres:
    image: pgvector/pgvector:pg18        # 内置 vector 扩展
    container_name: gexue-postgres
    environment:
      POSTGRES_USER: gexue
      POSTGRES_PASSWORD: gexue
      POSTGRES_DB: gexue
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ 镜像约定：挂载父目录，数据落在子目录（避免 mount 边界问题）
      - gexue_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gexue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gexue_pgdata:
