version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg18-latest
    environment:
      POSTGRES_USER: gexue
      POSTGRES_PASSWORD: gexue_password
      POSTGRES_DB: gexue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gexue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gexue"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  gexue-network:
    driver: bridge
